name: Auto Renew Bot-hosting

on:
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets[format('{0}_NODE_LINK', github.ref_name)] || secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          # 分支 acc1~acc5 读取对应前缀(ACC1_*);main 分支回退到不带前缀的旧变量名(SESSION_TOKEN 等)
          EMAIL: ${{ secrets[format('{0}_EMAIL', github.ref_name)] || secrets.EMAIL }}
          GH_TOKEN: ${{ secrets[format('{0}_GH_TOKEN', github.ref_name)] || secrets.GH_TOKEN }}
          SESSION_TOKEN: ${{ secrets[format('{0}_SESSION_TOKEN', github.ref_name)] || secrets.SESSION_TOKEN }}
          DISCORD_TOKEN: ${{ secrets[format('{0}_DISCORD_TOKEN', github.ref_name)] || secrets.DISCORD_TOKEN }}
          SESSION_SECRET_NAME: ${{ secrets[format('{0}_SESSION_TOKEN', github.ref_name)] != '' && format('{0}_SESSION_TOKEN', github.ref_name) || 'SESSION_TOKEN' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum python3 app.py

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 只清理当前分支的运行记录,避免误删其他账号(分支)的记录
          runs=$(gh run list --workflow="${{ github.workflow }}" --branch="${{ github.ref_name }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
